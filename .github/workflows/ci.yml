name: CI

# Nenhum merge na v3 sem esta esteira verde. Ver docs/DEPLOYMENT.md secao 7.
on:
  push:
    branches: [v3, main]
  pull_request:
    branches: [v3]
  # Disparo manual: em 2026-08-26 um push na v3 simplesmente NAO criou
  # execucao (so o check da Vercel apareceu no commit), deixando codigo no
  # repositorio sem esteira e uma migration sem aplicar no Supabase Dev.
  # Sem este gatilho, a unica saida seria um commit vazio so para acordar a
  # CI -- ruido no historico para contornar uma falha de plataforma.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `corepack enable` lê o campo `packageManager` do package.json e ativa a
      # versão exata do pnpm. Evita depender de uma action de terceiro só para
      # instalar o gerenciador de pacotes.
      - name: Ativar pnpm
        run: corepack enable

      # `--frozen-lockfile` falha se o lockfile estiver desatualizado em relação
      # aos package.json. É o que impede uma dependência entrar sem revisão.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Testes
        run: pnpm run test

      - name: Build
        run: pnpm run build

  integration:
    name: integração — migrations e RLS contra Postgres real
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ativar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Sobe o Postgres real e aplica todas as migrations do zero. Isto valida
      # duas coisas ao mesmo tempo: que as migrations aplicam numa base limpa,
      # e que as policies se comportam como o esperado.
      #
      # Testar RLS contra mock não provaria nada — o que está sob teste é o
      # comportamento do Postgres.
      - name: Subir Supabase local
        run: pnpm exec supabase start

      # A suite de RLS fala com o Postgres direto (`pg`), mas a de gravacao
      # idempotente (D-092) usa supabase-js contra o PostgREST -- e o que esta
      # sob teste ali e justamente o ON CONFLICT DO NOTHING que o PostgREST
      # monta. Sem estas variaveis ela nao tem como se conectar.
      - name: Configurar variaveis do Supabase local
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Testes de RLS e de gravacao idempotente
        run: pnpm --filter @sb/db run test:integration

      # As projecoes com embed do PostgREST sao avaliadas SO no servidor, e os
      # fakes das suites de unidade ignoram a string de `select` inteira -- de
      # proposito, porque modela-la seria reimplementar o PostgREST. Uma
      # projecao invalida passa verde em 518 testes e quebra em producao: foi
      # o PGRST201 de D-188. Este passo pergunta ao PostgREST de verdade.
      - name: Projecoes com embed aceitas pelo PostgREST
        run: pnpm --filter @sb/db run check:embeds

      - name: Derrubar Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  e2e:
    name: e2e — fluxos criticos (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ativar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar navegador do Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Job proprio (nao reusa o Supabase do job "integracao"): jobs do
      # GitHub Actions nao compartilham processo, cada um sobe o seu.
      - name: Subir Supabase local
        run: pnpm exec supabase start

      # `NEXT_PUBLIC_*` sao embutidas NO BUILD do Next.js, entao precisam
      # estar no ambiente ANTES do passo de build, nao so no de teste.
      - name: Configurar variaveis do Supabase local
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # `pnpm run build` (Turborepo), não `pnpm --filter web run build`: o
      # segundo chama `next build` direto, sem passar pelo grafo de
      # dependências — @sb/domain e @sb/db nunca seriam buildados antes,
      # e o build do web falharia com "Module not found".
      - name: Build web
        run: pnpm run build

      - name: Seed de dados do E2E
        run: pnpm --filter web run e2e:seed

      - name: Testes E2E
        run: pnpm --filter web run e2e

      - name: Relatorio do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Derrubar Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  migrations:
    name: aplicar migrations no Supabase Dev
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Só depois da esteira verde: migration aplicada a partir de código que não
    # compila é como se corrompe um ambiente.
    needs: [check, scripts, integration, e2e]

    # Nunca em pull request: o Preview da Vercel aponta para o mesmo banco Dev
    # (D-025), e uma migration de PR afetaria quem estivesse testando.
    #
    # `workflow_dispatch` entra junto de `push` porque sem ele o disparo manual
    # ficava pela metade -- foi o que aconteceu em 2026-08-26, quando um push
    # nao criou execucao e o dispatch de recuperacao rodou tudo MENOS aplicar a
    # migration. Um dispatch na v3 e um ato deliberado de quem tem acesso ao
    # repositorio, mesma confianca de um push.
    if: >-
      github.ref == 'refs/heads/v3'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    # Uma execução por vez. Duas aplicando migration no mesmo banco em paralelo
    # é a receita para um schema em estado indefinido.
    concurrency:
      group: supabase-migrations-dev
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ativar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # O ref do projeto não é segredo: aparece na URL do dashboard e nos
      # hostnames públicos. O que é segredo são o token e a senha.
      - name: Aplicar migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # `--yes` é obrigatório: os dois comandos pedem confirmação interativa
        # por padrão e travam num runner sem terminal.
        #
        # `db push` sem `--include-all` aplica apenas o que está pendente no
        # histórico remoto. É o comportamento desejado: incluir tudo às cegas
        # reaplicaria migrations que o remoto já considera resolvidas.
        run: |
          pnpm exec supabase link --project-ref nmgccyqquwxecqffsidr --yes
          pnpm exec supabase db push --yes --debug 2>&1

  scripts:
    name: scripts de infraestrutura
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Os scripts de infra/ rodam em bash e são versionados. Erro de sintaxe
      # aqui só apareceria na hora de provisionar, no pior momento possível.
      - name: Sintaxe dos scripts
        run: |
          for f in infra/*.sh; do
            bash -n "$f" && echo "ok: $f"
          done

      # Consumidor antes do produtor. Em 2026-08-20 a ordem inversa fez a api
      # enfileirar erp.import.parse enquanto o worker antigo ainda recusava o
      # tipo, deixando quatro batches presos em UPLOADED.
      - name: Ordem segura do deploy Cloud Run
        run: |
          worker_line="$(grep -n '^  build_and_deploy worker$' infra/deploy-cloud-run.sh | cut -d: -f1)"
          api_line="$(grep -n '^  build_and_deploy api$' infra/deploy-cloud-run.sh | cut -d: -f1)"
          test -n "$worker_line"
          test -n "$api_line"
          test "$worker_line" -lt "$api_line"

      # CRLF em shebang quebra com "bad interpreter" no Linux. O .gitattributes
      # previne, mas a verificação torna a regra observável.
      - name: Fim de linha LF
        run: |
          if grep -rlU $'\r' infra/ 2>/dev/null | grep -q .; then
            echo "CRLF encontrado em infra/" >&2
            exit 1
          fi
          echo "todos os arquivos em infra/ estão em LF"
