name: Reparo pontual do histórico de migrations no Dev

# Uso único: a migration 20260918125153 já foi executada no Dev com versão
# fora da ordem de publicação. O corpo idêntico foi republicado como
# 20260922150000; este workflow remove apenas o marcador antigo e deixa o
# `db push` aplicar a versão nova. Nunca aponta para produção.
on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Confirme o ref do Supabase de Dev"
        required: true
        type: string

permissions:
  contents: read

jobs:
  reparar:
    if: github.ref == 'refs/heads/v3' && inputs.confirmacao == 'nmgccyqquwxecqffsidr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: supabase-migrations-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ativar pnpm
        run: corepack enable
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Reparar somente o marcador fora de ordem no Dev
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DEV_PROJECT_REF: nmgccyqquwxecqffsidr
        run: |
          test ! -e supabase/migrations/20260918125153_fix_stock_movements_filters.sql
          test -e supabase/migrations/20260922150000_republicar_filtros_de_movimentacoes.sql
          pnpm exec supabase link --project-ref "${DEV_PROJECT_REF}" --yes
          pnpm exec supabase migration repair --status reverted 20260918125153 --linked --yes
          pnpm exec supabase db push --yes
          pnpm exec supabase migration list --linked
