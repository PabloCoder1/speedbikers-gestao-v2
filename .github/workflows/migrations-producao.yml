name: Preflight de migrations da VM

on:
  workflow_dispatch:
    inputs:
      catalogo:
        description: "Versões exportadas da VM (uma por linha)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Comparar catálogo da VM com o checkout
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Gerar plano vinculado ao commit
        shell: bash
        env:
          CATALOGO_VM: ${{ inputs.catalogo }}
        run: |
          printf '%s\n' "$CATALOGO_VM" |
            node infra/vm/check-migration-catalog.mjs --plan --bind-head |
            tee "$RUNNER_TEMP/plano-migrations-vm.json"

      - uses: actions/upload-artifact@v6
        with:
          name: plano-migrations-vm
          path: ${{ runner.temp }}/plano-migrations-vm.json
          if-no-files-found: error
          retention-days: 14
